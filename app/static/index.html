<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIMEVERSE — Anime Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--bg:#070814;--p:#0f1326;--p2:#151a32;--line:#272c4b;--text:#f5f5ff;--muted:#9ca3c7;--violet:#8b5cf6;--pink:#ec4899;--gold:#f5c451;--green:#34d399}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}body{margin:0;background:radial-gradient(circle at 10% 0,#21124b,transparent 32%),radial-gradient(circle at 100% 10%,#33102f,transparent 28%),var(--bg);color:var(--text);font-family:Inter,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(7,8,20,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{max-width:1400px;margin:auto;padding:16px 24px;display:flex;gap:28px;align-items:center}.logo{font:700 25px "Space Grotesk"}.logo b{color:var(--pink)}nav{display:flex;gap:5px;flex-wrap:wrap}nav button{background:none;border:0;color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer}nav button.active,nav button:hover{background:#181b35;color:#fff}
main{max-width:1400px;margin:auto;padding:30px 24px 70px}.view{display:none}.view.active{display:block}.hero{padding:35px 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#c9b8ff}.hero h1{font:700 clamp(42px,6vw,75px)/.96 "Space Grotesk";margin:12px 0}.hero p{max-width:760px;color:var(--muted);line-height:1.7;font-size:17px}
.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1.4fr 1fr}.panel,.card{background:linear-gradient(145deg,#11162b,#0c0f20);border:1px solid var(--line);border-radius:17px;padding:19px}.kpi small,.muted{color:var(--muted)}.kpi strong{display:block;font-size:30px;margin-top:8px}.kpi em{font-style:normal;color:var(--green);font-size:12px}
#kpis.kpi-rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(34px,6vw,92px);margin:34px 0 20px;padding:10px 2px 16px}#kpis .kpi{min-width:0;animation:kpi-in .55s cubic-bezier(.2,.7,.2,1) both}#kpis .kpi:nth-child(2){animation-delay:.07s}#kpis .kpi:nth-child(3){animation-delay:.14s}#kpis dt,#kpis dd{margin:0}#kpis .kpi-value{display:block;color:var(--text);font:700 clamp(40px,4vw,58px)/1 "Space Grotesk";letter-spacing:-.045em;font-variant-numeric:tabular-nums}#kpis .kpi-caption{display:block;margin-top:9px;color:var(--muted);font-size:13px;line-height:1.45}@keyframes kpi-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toolbar{display:flex;gap:9px;flex-wrap:wrap}.input,.select{background:#0a0d1b;border:1px solid var(--line);color:#fff;padding:12px;border-radius:10px;outline:0}.input{flex:1;min-width:240px}.btn{background:linear-gradient(135deg,var(--violet),var(--pink));border:0;color:#fff;padding:12px 17px;border-radius:10px;font-weight:700;cursor:pointer}.btn.alt{background:#171b35;border:1px solid var(--line)}
.library-hero{padding-bottom:22px}.library-hero p{margin-bottom:0}.library-toolbar{display:grid;grid-template-columns:minmax(260px,2fr) repeat(3,minmax(130px,1fr)) auto;gap:10px;padding:14px;background:rgba(15,19,38,.72);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px)}.library-toolbar .input{min-width:0;width:100%}.library-summary{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:22px 0 4px;color:var(--muted);font-size:13px}.library-list{border-top:1px solid var(--line)}.library-item{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:20px;align-items:start;padding:20px 0;border-bottom:1px solid var(--line)}.library-poster{position:relative;width:112px;aspect-ratio:2/3;overflow:hidden;border-radius:10px;background:linear-gradient(145deg,var(--poster,#312e81),#0c0f20);box-shadow:0 12px 28px #0007}.library-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.poster-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:10px;color:#fff;font:700 24px "Space Grotesk";letter-spacing:-.04em;text-align:center}.library-rank{color:#777f9f;font-size:12px;font-weight:700;letter-spacing:.08em}.library-name{display:block;margin:5px 0 8px;padding:0;background:none;border:0;color:var(--text);font:700 22px/1.2 "Space Grotesk";text-align:left;cursor:pointer}.library-name:hover{color:#c4b5fd}.library-facts{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.library-facts span:not(:last-child):after{content:"·";margin-left:8px;color:#555d7c}.library-rating{display:flex;align-items:center;gap:6px;margin-top:12px;font-weight:700}.library-rating b{color:var(--gold)}.library-genres{margin:10px 0 5px;color:#c7c9dc;font-size:13px;line-height:1.5}.library-studio{margin:0;color:var(--muted);font-size:12px}.library-actions{align-self:center}.library-pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:24px}.library-page-label{min-width:90px;color:var(--muted);font-size:12px;text-align:center}.library-loading{padding:46px 0;color:var(--muted);text-align:center}
.title{font:700 24px "Space Grotesk";margin:30px 0 14px}.anime h3{margin:0 0 8px;font-size:17px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.tag{background:#191d37;padding:5px 8px;border-radius:8px}.score{color:var(--gold);font-weight:800}.bar{height:7px;background:#222641;border-radius:20px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--pink))}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--muted)}.scroll{overflow:auto}.pager{display:flex;justify-content:center;gap:6px;margin-top:18px}.page{background:#12162b;color:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:8px;cursor:pointer}.empty{padding:40px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{max-width:760px;width:100%;max-height:85vh;overflow:auto;background:#0d1020;border:1px solid var(--line);border-radius:20px;padding:25px}.close{float:right;background:none;border:0;color:#aaa;font-size:25px}
.catalog-error{display:none;margin:28px 0 0;color:#fb7185;font-size:14px}.catalog-error.show{display:block}
@media(max-width:900px){.kpis,.cards,.two{grid-template-columns:1fr 1fr}#kpis.kpi-rail{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.library-toolbar{grid-template-columns:1fr 1fr}.library-toolbar .btn{grid-column:span 2}.library-item{grid-template-columns:96px minmax(0,1fr)}.library-poster{width:96px}.library-actions{grid-column:2;justify-self:start}}@media(max-width:600px){.kpis,.cards,.two{grid-template-columns:1fr}#kpis.kpi-rail{grid-template-columns:1fr;gap:28px;margin-top:28px}#kpis .kpi-value{font-size:44px}.nav{flex-direction:column;align-items:flex-start}.library-toolbar{grid-template-columns:1fr}.library-toolbar .btn{grid-column:auto}.library-item{grid-template-columns:78px minmax(0,1fr);gap:13px;padding:16px 0}.library-poster{width:78px;border-radius:8px}.library-name{font-size:18px}.library-actions{grid-column:2}.library-actions .btn{padding:9px 12px;font-size:12px}}@media(prefers-reduced-motion:reduce){#kpis .kpi{animation:none}}
.eyebrow { display: none !important; }
</style></head><body>
<header><div class="nav"><div class="logo">ANIME<b>VERSE</b></div><nav>
<button class=active data-v=home>Home</button><button data-v=library>Library</button><button data-v=recommend>Recommendations</button><button data-v=gems>Hidden Gems</button>
</nav></div></header>
<main>
<section id=home class="view active"><div class=hero><div class=eyebrow></div><h1>Discover. Analyze.<br><span style="color:#a78bfa">Recommend.</span></h1><p></p><div class=toolbar><button class=btn onclick="go('library')">Browse Library →</button><button class="btn alt" onclick="go('recommend')">Get Recommendations</button></div></div><dl id=kpis class=kpi-rail aria-label="Catalog statistics" aria-live=polite></dl><p id=homeError class=catalog-error role=status></p></section>
<section id=library class=view><div class="hero library-hero"><h1>Anime Library</h1><p>Browse the complete catalog, compare ratings, and discover your next watch.</p></div><div class=library-toolbar><input id=libraryQ class=input placeholder="Search titles, genres, or studios" aria-label="Search the anime library" onkeydown="if(event.key==='Enter')loadLibrary(0)"><select id=libraryGenre class=select aria-label="Filter by genre"><option value="">All genres</option></select><select id=libraryType class=select aria-label="Filter by format"><option value="">All formats</option></select><select id=librarySort class=select aria-label="Sort library"><option value=rating>Top rated</option><option value=popular>Most popular</option><option value=newest>Newest</option><option value=title>Title A–Z</option></select><button class=btn onclick="loadLibrary(0)">Search</button></div><div id=librarySummary class=library-summary></div><div id=libraryResults class=library-list></div><div id=libraryPager class=library-pager></div></section>
<section id=recommend class=view><div class=hero><div class=eyebrow></div><h1>Recommendations</h1><p></p></div><div class=panel><div class=toolbar><input id=recQ class=input placeholder="Search an anime title"><button class=btn onclick=findRec()>Find & Recommend</button></div><div id=rec class=empty>Enter an anime title.</div></div></section>
<section id=gems class=view><div class=hero><div class=eyebrow>QUALITY × DISCOVERY</div><h1>Hidden Gems 💎</h1><p>Highly rated titles with comparatively lower popularity.</p></div><div id=gemsGrid class="grid cards"></div></section>
</main>
<div id=modal class=modal><div class=modalbox><button class=close onclick=closeModal()>×</button><div id=modalBody></div></div></div>
<script>
const API="";const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function go(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));$("#"+v).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.v===v));if(v==="library")loadLibrary(0);if(v==="gems")loadGems();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(x=>x.onclick=()=>go(x.dataset.v));
async function api(u){let r=await fetch(API+u);if(!r.ok)throw Error(await r.text());return r.json()}
async function boot(){try{let [s,m]=await Promise.all([api("/api/stats"),api("/api/meta")]);$("#kpis").innerHTML=[["Total Anime",s.total_anime,"Titles available"],["Studios",s.studios,"Individual studios represented"],["Genres",s.genres,"Genres represented"]].map(x=>`<div class=kpi><dt class=sr-only>${x[0]}</dt><dd><strong class=kpi-value>${Number(x[1]).toLocaleString()}</strong><span class=kpi-caption>${x[2]}</span></dd></div>`).join("");m.genres.forEach(g=>$("#libraryGenre").insertAdjacentHTML("beforeend",`<option>${esc(g)}</option>`));m.types.forEach(t=>$("#libraryType").insertAdjacentHTML("beforeend",`<option>${esc(t)}</option>`));$("#homeError").classList.remove("show");}catch(e){console.error(e);$("#homeError").textContent="The catalog is temporarily unavailable. Please try again shortly.";$("#homeError").classList.add("show")}}
function posterInitials(name){return String(name||"AN").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
async function loadLibrary(offset=0){const limit=18,params=new URLSearchParams({q:$("#libraryQ").value.trim(),genre:$("#libraryGenre").value,type:$("#libraryType").value,sort:$("#librarySort").value,limit,offset});$("#librarySummary").innerHTML="<span>Loading library…</span>";$("#libraryResults").innerHTML="<div class=library-loading>Finding titles and artwork…</div>";$("#libraryPager").innerHTML="";try{let result=await api("/api/library?"+params),items=result.items||[],total=Number(result.total||0),end=Math.min(offset+items.length,total),page=Math.floor(offset/limit)+1,pages=Math.max(1,Math.ceil(total/limit));$("#librarySummary").innerHTML=`<span><b style="color:var(--text)">${total.toLocaleString()}</b> titles</span><span>Showing ${total?offset+1:0}–${end}</span>`;if(!items.length){$("#libraryResults").innerHTML="<div class=empty>No anime matched those filters.</div>";return}$("#libraryResults").innerHTML=items.map((x,i)=>{let facts=[x.year||"Year unknown",x.type||"Format unknown",x.episodes?`${x.episodes} episode${x.episodes===1?"":"s"}`:null,x.popularity?`Popularity #${Number(x.popularity).toLocaleString()}`:null].filter(Boolean),color=/^#[0-9a-f]{6}$/i.test(x.image_color||"")?x.image_color:"#312e81",poster=x.image_url?`<img src="${esc(x.image_url)}" alt="Poster for ${esc(x.name)}" loading=lazy onerror="this.remove()">`:"";return `<article class=library-item><div class=library-poster style="--poster:${color}"><span class=poster-fallback>${esc(posterInitials(x.name))}</span>${poster}</div><div class=library-info><div class=library-rank>#${offset+i+1}</div><button class=library-name onclick="detail(${x.id})">${esc(x.name)}</button><div class=library-facts>${facts.map(v=>`<span>${esc(v)}</span>`).join("")}</div><div class=library-rating><b>★</b><span>${x.score??"Not rated"}</span></div><p class=library-genres>${esc(x.genres||"Genres not listed")}</p><p class=library-studio>${x.studios?`Studio: ${esc(x.studios)}`:"Studio not listed"}</p></div><div class=library-actions><button class="btn alt" onclick="detail(${x.id})">View details</button></div></article>`}).join("");$("#libraryPager").innerHTML=`${offset>0?`<button class=page onclick="loadLibrary(${Math.max(0,offset-limit)})">← Previous</button>`:""}<span class=library-page-label>Page ${page} of ${pages}</span>${offset+limit<total?`<button class=page onclick="loadLibrary(${offset+limit})">Next →</button>`:""}`;}catch(e){console.error(e);$("#librarySummary").innerHTML="";$("#libraryResults").innerHTML="<div class=empty>The library is temporarily unavailable. Please try again shortly.</div>"}}
async function detail(id){let x=await api("/api/anime/"+id);$("#modalBody").innerHTML=`<div class=eyebrow>ANIME DETAILS</div><h1 style="font-family:'Space Grotesk'">${esc(x.name)}</h1><div class=grid kpis><div class=card><small>Score</small><h2 class=score>★ ${x.score??"—"}</h2></div><div class=card><small>Popularity</small><h2>${x.popularity??"—"}</h2></div></div><p class=muted><b>Genres:</b> ${esc(x.genres)}<br><b>Studio:</b> ${esc(x.studios)}<br><b>Type:</b> ${esc(x.type)}<br><b>Year:</b> ${x.year||"—"}<br><b>Episodes:</b> ${x.episodes||"—"}</p><p style="line-height:1.7">${esc(x.synopsis)||"No synopsis available."}</p><button class=btn onclick="closeModal();go('recommend');$('#recQ').value='${esc(x.name).replaceAll("'","&#39;")}';findRec()">Recommend similar</button>`;$("#modal").classList.add("show")}
function closeModal(){$("#modal").classList.remove("show")}
async function findRec(){let q=$("#recQ").value.trim();if(!q)return;let a=await api("/api/anime?q="+encodeURIComponent(q)+"&limit=1");if(!a.length){$("#rec").innerHTML="<div class=empty>Anime not found.</div>";return}let out=await api("/api/recommendations/"+a[0].id+"?limit=10");$("#rec").innerHTML=`<h3>Because you chose ${esc(a[0].name)}</h3><div class=grid cards>${out.map(x=>`<div class=card anime><h3>${esc(x.name)}</h3><div class=score>${Math.round(x.similarity*100)}% similar</div><p class=muted>${esc(x.genres)}</p></div>`).join("")}</div>`}
async function loadGems(){let a=await api("/api/hidden-gems?limit=12");$("#gemsGrid").innerHTML=a.map((x,i)=>`<div class=card anime><div class=meta><span class=tag>💎 #${i+1}</span><span class=score>★ ${x.score}</span></div><h3 style="margin-top:12px">${esc(x.name)}</h3><p class=muted>${esc(x.genres)}<br>Popularity: ${x.popularity}</p></div>`).join("")}
boot();
</script></body></html>
